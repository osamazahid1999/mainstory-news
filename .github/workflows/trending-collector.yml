name: Trending News Collector

on:
  workflow_dispatch:
  schedule:
    # 06:00, 12:00 and 18:00 Pakistan time (UTC+5)
    - cron: "0 1 * * *"
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"

concurrency:
  group: trending-news-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SANITY_PROJECT_ID" || (echo "Missing NEXT_PUBLIC_SANITY_PROJECT_ID" && exit 1)
          test -n "$NEXT_PUBLIC_SANITY_DATASET" || (echo "Missing NEXT_PUBLIC_SANITY_DATASET" && exit 1)
          test -n "$SANITY_API_WRITE_TOKEN" || (echo "Missing SANITY_API_WRITE_TOKEN" && exit 1)
          echo "Required Sanity secrets are present."

      - name: Collect trending candidates
        run: npm run collect:trending

      - name: Verify Trending Queue
        run: npm run verify:trending
